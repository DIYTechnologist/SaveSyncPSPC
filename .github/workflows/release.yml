name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, e.g. 2026.0724.153000"
        required: true
        type: string
      release_type:
        description: "Whether to publish this as a pre-release or a full release"
        required: true
        type: choice
        options:
          - prerelease
          - release
        default: prerelease

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest

    steps:
      - name: Resolve tag
        id: ref
        run: |
          tag="${{ inputs.tag }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.tag }}
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Test
        run: make test

      - name: Build release binaries
        run: make release VERSION="${{ steps.ref.outputs.tag }}"

      - name: Package release assets
        run: |
          mkdir -p release
          tar -C dist/linux-amd64 -czf "release/save-sync-ps-pc-linux-amd64.tar.gz" .
          tar -C dist/linux-arm64 -czf "release/save-sync-ps-pc-linux-arm64.tar.gz" .
          (cd dist/windows-amd64 && zip -r "../../release/save-sync-ps-pc-windows-amd64.zip" .)
          (cd release && sha256sum * > "save-sync-ps-pc-checksums.txt")

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: save-sync-ps-pc-release-${{ steps.ref.outputs.tag }}
          path: release/
          retention-days: 1

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.ref.outputs.tag }}"
          args=(--title "$tag" --generate-notes)
          if [ "${{ inputs.release_type }}" = "prerelease" ]; then
            args+=(--prerelease)
          fi
          gh release create "$tag" release/* "${args[@]}"
