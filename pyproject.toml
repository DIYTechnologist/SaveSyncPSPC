[project]
name = "save-sync-ps-pc"
version = "0.1.0"
description = "Save Sync PS-PC bridge for moving supported saves between PlayStation and PC"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
save-sync = "garlicsync.cli:main"
save-sync-ui = "garlicsync.service:main"
garlic-sync = "garlicsync.cli:main"
garlic-sync-ui = "garlicsync.service:main"

[tool.uv]
package = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
garlicsync = ["games/*.json"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.12.0",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"src/garlicsync/games/*.py" = ["E402"]
